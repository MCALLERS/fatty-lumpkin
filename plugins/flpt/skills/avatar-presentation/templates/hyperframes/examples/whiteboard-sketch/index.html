<!doctype html>
<!--
  WHITEBOARD SKETCH ("avocado toast") starter: doodles draw themselves stroke by stroke, a marker riding
  the tip. Silent 1920x1080 30 fps MP4 per slide. The SCENE below is the doodle kit sheet: copy the doodles
  you need, delete the rest. How to author doodles, labels and beats: README.md (same folder).
  Keep x 0-380, y 700-1080 empty (presenter bubble) and labels 64 px from the edges.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Whiteboard sketch</title>
    <style>
      /* ─── 1. TOKENS: the whole look lives here ─────────────────────────────── */
      :root {
        --board: #fbfaf6; /* warm whiteboard */
        --ink: #17202b; /* line work */
        --ox: #8e2c48; /* the bad / risky path, and the final circle */
        --blue: #1f5a85; /* the good path, facts */
        --amber: #8a5310; /* sparingly: one extra thing (a reload, fire, gold) */
        --muted: #5b6573;
        /* flat "colouring-in" tints: fade them in under a finished outline */
        --ink-tint: #e9e6de;
        --ox-tint: #f2dbe1;
        --blue-tint: #dbe7f2;
        --amber-tint: #f5e4c4;
        --white: #ffffff;
        --blue-zone: #bcd3e8; /* stronger tints, for thick strokes such as gauge zones */
        --ox-zone: #ebc6d0;

        --w: 7px; /* marker: most outlines */
        --w-fine: 5px; /* details: faces, ticks, fins */
        --w-bold: 9px; /* emphasis: final circle, underline, cross-out */

        --font-hand: "Caveat", cursive; /* local woff2 below; generic fallback only */
        --t-label: 50px;
        --t-small: 34px;

        --dim: 0.4;

        /* presenter bubble (pipeline overlay, bottom-left): keep this area free */
        --bubble-x: 48px;
        --bubble-y: 732px;
        --bubble-d: 300px;
        --bubble-pad: 32px;
      }

      @font-face {
        font-family: "Caveat";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/caveat-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 600;
        font-style: normal;
        src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2");
      }

      /* ─── 2. FRAME + ENGINE HOOKS + BOARD + PEN (keep) ─────────────────────── */
      @property --in {
        syntax: "<number>";
        inherits: false;
        initial-value: 1;
      }
      @property --lit {
        syntax: "<number>";
        inherits: false;
        initial-value: 1;
      }
      html,
      body {
        margin: 0;
        background: var(--board);
      }
      #slide {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--board);
        color: var(--ink);
        font-family: var(--font-hand);
        -webkit-font-smoothing: antialiased;
      }
      #slide * {
        box-sizing: border-box;
      }
      .lv {
        opacity: calc(var(--in) * var(--lit));
      }
      .lv-w {
        display: inline-block;
      }
      .stage,
      .board-tex {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      /* static: the board never animates, so the last frame stays still */
      .board-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 78% 74% at 52% 46%, rgba(23, 32, 43, 0) 58%, rgba(23, 32, 43, 0.07) 100%);
      }

      /* doodle strokes: marker ink, round caps and joins. Colour = the class on the group. */
      .d path {
        fill: none;
        stroke: currentColor;
        stroke-width: var(--w);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .d .fine {
        stroke-width: var(--w-fine);
      }
      .d .bold {
        stroke-width: var(--w-bold);
      }
      .d .dot {
        stroke-width: 11px; /* a zero-length stroke with a round cap = a dot */
      }
      .ink {
        color: var(--ink);
      }
      .ox {
        color: var(--ox);
      }
      .blue {
        color: var(--blue);
      }
      .amber {
        color: var(--amber);
      }
      .muted {
        color: var(--muted);
      }
      /* fills: flat tints under the outline, slightly off-register like real colouring-in */
      .fill path {
        stroke: none;
      }
      .f-ink {
        fill: var(--ink-tint);
      }
      .f-ox {
        fill: var(--ox-tint);
      }
      .f-blue {
        fill: var(--blue-tint);
      }
      .f-amber {
        fill: var(--amber-tint);
      }
      .f-white {
        fill: var(--white);
      }
      /* dotted line: a solid white mask path draws it on (README: "Dotted lines") */
      .dotted {
        fill: none;
        stroke: currentColor;
        stroke-width: 8px;
        stroke-linecap: round;
        stroke-dasharray: 0.1 18;
      }
      .reveal {
        fill: none;
        stroke: #fff;
        stroke-width: 34px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* hand lettering (Caveat). A board-coloured halo keeps it legible over lines. */
      .hand {
        font-family: var(--font-hand);
        font-weight: 700;
        font-size: var(--t-label);
        fill: currentColor;
        paint-order: stroke;
        stroke: var(--board);
        stroke-width: 10px;
        stroke-linejoin: round;
      }
      .hand.small {
        font-size: var(--t-small);
        font-weight: 600;
      }
      .hand tspan {
        fill: currentColor; /* <tspan class="blue">…</tspan> colours part of a label */
      }
      /* a doodle scaled with its wrapper scales its strokes too: put it back to marker weight, e.g.
         <g class="d ox reweight"> inside a scale(0.76) wrapper -> 9.5 / 7.5 px before scaling */
      .d.reweight path {
        stroke-width: 9.5px;
      }
      .d.reweight path.fine {
        stroke-width: 7.5px;
      }

      /* the pen: a whiteboard marker whose tip sits at (0,0). --pen is set per stroke by the engine */
      .lv-pen-nib {
        fill: var(--pen, var(--ink));
      }
      .lv-pen-halo {
        fill: var(--pen, var(--ink));
        fill-opacity: 0.14;
      }
      .mk-shadow {
        fill: rgba(23, 32, 43, 0.13);
      }
      .mk-tip {
        fill: var(--pen, var(--ink));
      }
      .mk-collar {
        fill: #dcd6ca;
        stroke: var(--ink);
        stroke-width: 2.5px;
        stroke-linejoin: round;
      }
      .mk-barrel {
        fill: #fdfcf9;
        stroke: var(--ink);
        stroke-width: 3px;
      }
      .mk-cap {
        fill: var(--pen, var(--ink));
        stroke: var(--ink);
        stroke-width: 3px;
      }
      .mk-shine {
        fill: none;
        stroke: rgba(255, 255, 255, 0.45);
        stroke-width: 4px;
        stroke-linecap: round;
      }
      .mk-line {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2px;
        stroke-opacity: 0.35;
        stroke-linecap: round;
      }

      .guide {
        display: none;
        position: absolute;
        pointer-events: none;
      }
      .show-guides .guide {
        display: block;
      }
      .guide-safe {
        inset: 64px;
        border: 2px dashed rgba(142, 44, 72, 0.5);
      }
      .guide-keepout {
        left: 0;
        top: calc(var(--bubble-y) - var(--bubble-pad));
        width: calc(var(--bubble-x) + var(--bubble-d) + var(--bubble-pad));
        height: calc(1080px - var(--bubble-y) + var(--bubble-pad));
        background: rgba(142, 44, 72, 0.1);
      }
      .guide-bubble {
        left: var(--bubble-x);
        top: var(--bubble-y);
        width: var(--bubble-d);
        height: var(--bubble-d);
        border-radius: 22%;
        border: 4px solid rgba(142, 44, 72, 0.7);
      }

      /* ─── 3. SCENE: the doodle kit sheet (replace for your slide) ──────────── */
      .kit-label {
        font-size: var(--t-small);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="slide"
      data-composition-id="slide"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-duration="33"
    >
      <!-- BOARD (keep): faint deterministic texture (fixed feTurbulence seeds) + a soft vignette -->
      <svg class="board-tex" viewBox="0 0 1920 1080" aria-hidden="true">
        <filter id="tooth" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
          <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="11" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.13  0 0 0 0 0.17  3.2 0 0 0 -1.55" />
        </filter>
        <filter id="mottle" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse">
          <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0042" numOctaves="3" seed="4" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.33  0 0 0 0 0.3  2.4 0 0 0 -1.05" />
        </filter>
        <rect width="1920" height="1080" filter="url(#mottle)" opacity="0.10" />
        <rect width="1920" height="1080" filter="url(#tooth)" opacity="0.055" />
      </svg>
      <div class="board-vignette"></div>

      <!-- SCENE: one full-frame SVG, units = video pixels. Doodle = placing <g transform> > fill <g> + stroke <g>. -->

          </mask>
        </defs>

          </g>
        </g>
        <text id="kit-figure-label" class="hand kit-label muted" x="236" y="392" text-anchor="middle">figure</text>

        <!-- SAVE ICON (floppy). Origin = centre, 84 x 84. Pop the outer #kit-save, or draw -ink + fade -fill -->
        <g transform="translate(560 262)">
          <g id="kit-save" data-wobble="1" data-seed="save">
            <g id="kit-save-fill" class="fill">
              <path class="f-amber" d="M -38 -38 L 30 -39 L 42 -27 L 41 40 L -39 40 Z" />
              <path class="f-white" d="M -25 9 L 25 9 L 25 40 L -25 40 Z" />
            </g>
            <g id="kit-save-ink" class="d ink">
              <path d="M -30 -42 L 28 -42 L 42 -28 L 42 36 Q 42 42 36 42 L -36 42 Q -42 42 -42 36 L -42 -36 Q -42 -42 -36 -42 L -24 -42" />

        <text id="kit-save-label" class="hand kit-label muted" x="560" y="392" text-anchor="middle">save icon</text>

        <g transform="translate(730 112)">

            <path class="fine" d="M 14 18 C 15 26 16 27 24 28 C 16 29 15 30 14 38 C 13 30 12 29 4 28 C 12 27 13 26 14 18" />

        <g transform="translate(1650 280)">
